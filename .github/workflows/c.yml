name: c

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Tests
        run: make test
      - name: Release (NDEBUG) tests
        run: make release-test
      - name: ASan+UBSan
        run: make asan
      - name: cppcheck
        run: sudo apt-get install cppcheck
          make cppcheck
      - name: Format
        run: |
          python3 -m pip install --quiet "clang-format==22.1.8"
          make format-check
      - name: Rust parity
        run: cargo +nightly test
      - name: PTY differential (Rust vs C)
        run: |
          cargo +nightly build --bin edit
          make build/edit
          python3 tools/diff_edit_pty.py
      - name: Benchmarks (report only)
        continue-on-error: true
        run: |
          make bench > c-bench.txt
          cargo +nightly bench --bench lib -- \
            --warm-up-time 1 --measurement-time 2 --sample-size 30 > rust-bench.txt 2>&1
          python3 tools/bench_compare.py --c c-bench.txt --rust rust-bench.txt
