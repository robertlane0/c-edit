name: c

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Tests
        run: make test
      - name: Release (NDEBUG) tests
        run: make release-test
      - name: ASan+UBSan
        run: make asan
      - name: cppcheck
        run: sudo apt-get install cppcheck
          make cppcheck
      - name: Format
        run: make format-check
      - name: Rust parity
        run: cargo +nightly test
      - name: PTY differential (Rust vs C)
        run: |
          cargo +nightly build --bin edit
          make build/edit
          python3 tools/diff_edit_pty.py
